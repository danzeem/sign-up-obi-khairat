<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ObiKhairat • Sign Up</title>
  <link rel="stylesheet" href="sign-up.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
</head>

<body>
  <main class="auth">
    <form class="card" action="/sign-up" method="post" novalidate>
      <header class="card__header">
        <h1 class="title">Create an account</h1>
        <p class="subtext">
          Already have an account?
          <a class="link" href="#">Sign in</a>
        </p>
      </header>

      <div class="fields">
        <div class="field">
          <input id="first-name" name="firstName" type="text" placeholder=" " autocomplete="given-name" required />
          <label for="first-name">First name</label>
        </div>

        <div class="field">
          <input id="last-name" name="lastName" type="text" placeholder=" " autocomplete="family-name" required />
          <label for="last-name">Last name</label>
        </div>

        <div class="field">
          <input id="email" name="email" type="email" placeholder=" " autocomplete="email" required />
          <label for="email">Email address</label>
        </div>

        <div class="field">
          <input id="password" name="password" type="password" placeholder=" " autocomplete="new-password" minlength="8" required />
          <label for="password">Password</label>
        </div>
      </div>

      <button class="btn" type="submit">Sign Up</button>

      <p class="footnote">
        By signing up, you agree to our <a class="link" href="#">Terms</a> and <a class="link" href="#">Privacy Policy</a>.
      </p>
    </form>
  </main>
</body>
</html>
